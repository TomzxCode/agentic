<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task repository link - mockup</title>
  <style>
    :root {
      --bg: #0f1115; --bg-1: #161a21; --bg-2: #1c222c; --bg-3: #232a36;
      --border: #2a3140; --text: #e6e9ef; --muted: #94a0b4;
      --accent: #6ee7b7; --accent-2: #3b82f6; --danger: #f87171; --warn: #fbbf24;
      --radius: 10px; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .main { padding: 20px; max-width: 820px; }
    h1 { font-size: 20px; margin: 0; }
    .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .spread { justify-content: space-between; }
    .muted { color: var(--muted); }
    .mono { font-family: var(--mono); font-size: 12px; color: var(--muted); }
    .panel { background: var(--bg-1); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-top: 14px; }
    .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; background: var(--bg-3);
      border: 1px solid var(--border); color: var(--muted); font-size: 12px; }
    .btn.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px;
      background: var(--bg-3); border: 1px solid var(--accent); color: var(--accent); font-size: 13px; }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 8px;
      background: var(--bg-3); border: 1px solid var(--border); color: var(--text); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #06231a; font-weight: 600; }
    .state { margin-top: 26px; }
    .state > .label { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
      border-top: 1px dashed var(--border); padding-top: 10px; margin-bottom: 6px; }
    @media (max-width: 760px) { .main { padding: 14px; } }
  </style>
</head>
<body>
  <main class="main">
    <div class="state">
      <div class="label">Task detail: repository chips link to their detail page</div>
      <h1>Fix login redirect</h1>
      <div class="panel">
        <div class="row" style="gap:8px">
          <span class="badge">open</span>
          <span class="badge">High</span>
          <a class="btn chip" href="repository-detail.html">▦ api</a>
          <a class="btn chip" href="repository-detail.html">▦ web</a>
          <span class="muted">repositories (selecting one opens its page)</span>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
