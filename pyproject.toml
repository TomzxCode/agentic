[project]
name = "agentic-workspace"
version = "0.0.0"
description = "Agentic monorepo: the backend API server and the command-line client."
requires-python = ">=3.12"
# Depend on the workspace members so a single `uv sync` installs both and their
# console scripts (agentic, agentic-server) land in the shared virtualenv.
dependencies = ["agentic", "agentic-cli", "agentic-launcher"]

[project.urls]
Repository = "https://github.com/TomzxCode/agentic"
Documentation = "https://tomzxcode.github.io/agentic/"

[tool.uv]
# The root is a virtual workspace project, not an installable package.
package = false

[tool.uv.workspace]
members = ["backend", "cli", "launcher"]

[tool.uv.sources]
agentic = { workspace = true }
agentic-cli = { workspace = true }
agentic-launcher = { workspace = true }

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.1",
    "ty>=0.0.87",
    "zensical>=0.0.70",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["backend/src", "cli/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: FastAPI's `Depends()` in argument defaults is the intended pattern.
ignore = ["B008"]

[tool.ty.environment]
# Target the declared Python floor (requires-python >=3.12) rather than the
# local interpreter, so type checking does not silently depend on the runtime.
python-version = "3.12"

[tool.pytest.ini_options]
testpaths = ["backend/tests", "cli/tests"]
# Coverage is off by default so `pytest` and `make test-backend` are fast. Turn it
# on with the coverage flags, or `make coverage-backend` (which also writes XML):
#   uv run pytest --cov=agentic --cov=agentic_cli --cov-report=term-missing
#   make test-backend COV="--cov=agentic --cov=agentic_cli --cov-report=term-missing"

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
# Omit fully covered files from the terminal report to keep it readable.
skip_covered = true
