[project]
site_name = "Agentic"
site_url = "https://tomzxcode.github.io/agentic/"
site_description = "A local-first work tracker for a developer who works alongside coding agents."
site_author = "Tom Rochette"
copyright = "Copyright &copy; 2026 Tom Rochette"

repo_url = "https://github.com/TomzxCode/agentic"
repo_name = "TomzxCode/agentic"
edit_uri = "edit/main/docs/"

nav = [
  { "Home" = "index.md" },
  { "Tutorial" = "tutorials/getting-started.md" },
  { "How-to guides" = [
    { "Import a GitHub issue or Slack thread" = "how-to/import-work.md" },
    { "Run an agent against a task" = "how-to/run-an-agent.md" },
    { "Read the review queue" = "how-to/review-pull-requests.md" },
    { "Triage reviewer feedback" = "how-to/triage-pr-feedback.md" },
    { "Create and remove worktrees" = "how-to/use-worktrees.md" },
    { "Use the focus stack" = "how-to/use-the-focus-stack.md" },
    { "Track changes and read the metrics" = "how-to/track-changes-and-metrics.md" },
    { "Configure session links" = "how-to/configure-session-links.md" },
    { "Open items in ghx and slackx" = "how-to/open-items-in-local-tools.md" },
    { "Refresh items on a schedule" = "how-to/refresh-items.md" },
    { "Schedule a shell command" = "how-to/schedule-a-script.md" },
    { "Expose Agentic on your network" = "how-to/expose-on-your-network.md" },
  ] },
  { "Views" = [
    { "Stack" = "views/stack.md" },
    { "Tasks" = "views/tasks.md" },
    { "Task" = "views/task.md" },
    { "Inbox" = "views/inbox.md" },
    { "Review queue" = "views/reviews.md" },
    { "My PRs" = "views/my-pulls.md" },
    { "PR feedback" = "views/feedback.md" },
    { "Decisions" = "views/decisions.md" },
    { "Gantt" = "views/gantt.md" },
    { "Graph" = "views/graph.md" },
    { "Events" = "views/events.md" },
    { "Metrics" = "views/metrics.md" },
    { "Items" = "views/items.md" },
    { "People" = "views/people.md" },
    { "Repositories" = "views/repositories.md" },
    { "Scheduled tasks" = "views/schedules.md" },
    { "Settings" = "views/settings.md" },
  ] },
  { "Reference" = [
    { "CLI" = "reference/cli.md" },
    { "Configuration" = "reference/configuration.md" },
    { "HTTP API" = "reference/http-api.md" },
  ] },
  { "Explanation" = [
    { "Concepts" = "explanation/concepts.md" },
    { "How agents are wired" = "explanation/how-agents-are-wired.md" },
    { "Why Agentic is local-first" = "explanation/local-first.md" },
  ] },
]

[project.theme]
variant = "modern"
language = "en"
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/TomzxCode/agentic"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
