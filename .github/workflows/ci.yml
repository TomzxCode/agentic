name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python (lint + type check + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Format check
        run: uv run --frozen ruff format --check .

      - name: Type check
        run: uv run --frozen ty check

      - name: Test
        run: uv run --frozen pytest -q -n auto --cov=agentic --cov=agentic_cli --cov-report=xml:coverage.xml

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-backend
          path: coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint + tests + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true
          package_json_file: frontend/package.json
          cache_dependency_path: frontend/pnpm-lock.yaml

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: frontend
        run: pnpm run lint

      - name: Format check
        working-directory: frontend
        run: pnpm run format:check

      - name: Test
        working-directory: frontend
        run: pnpm run coverage

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-frontend
          path: frontend/coverage
          if-no-files-found: ignore

      - name: Build
        working-directory: frontend
        run: pnpm run build
