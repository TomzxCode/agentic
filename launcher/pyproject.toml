[project]
name = "agentic-launcher"
version = "0.1.0"
description = "Menu-bar/tray companion for the Agentic stack: a global hotkey and Mark Done (pop)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pystray>=0.19",
    "pynput>=1.7",
    "pillow>=13.0.0",
]

[project.scripts]
agentic-stack = "agentic_launcher.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_launcher"]
