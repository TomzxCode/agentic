[project]
name = "agentic-cli"
version = "0.1.0"
description = "Command-line client for the Agentic app (tasks, items, worktrees, agent runs)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "cyclopts>=5.2.0",
    "rich>=13.0",
]

[project.scripts]
agentic = "agentic_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_cli"]
