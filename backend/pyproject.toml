[project]
name = "agentic"
version = "0.1.0"
description = "Track work as problems and collaborate with LLM coding agents across Slack, GitHub, and Google Drive."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "agent-client-protocol>=0.12",
    "httpx>=0.27",
    "structlog>=24.1",
    "pydantic-settings>=2.0",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
agentic = "agentic.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: FastAPI's `Depends()` in argument defaults is the intended pattern.
ignore = ["B008"]
