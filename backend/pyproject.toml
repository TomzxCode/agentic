[project]
name = "agentic"
version = "0.1.0"
description = "Track work as tasks and collaborate with LLM coding agents across Slack, GitHub, and Google Drive."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.159.1",
    "uvicorn[standard]>=0.54.0",
    "sqlmodel>=0.0.22",
    "agent-client-protocol>=0.12",
    "httpx>=0.27",
    "structlog>=24.1",
    "pydantic-settings>=2.16.1",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.9",
    "cyclopts>=5.2.0",
    "saq[sqlite]",
    "scalar-fastapi>=1.9.1",
    "croniter>=6.2.4",
    "tzlocal>=5.4.4",
    "pyyaml>=6.0.3",
]

[project.scripts]
agentic-server = "agentic.server_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic"]

[tool.uv.sources]
saq = { git = "https://github.com/tomzxforks/saq", rev = "dev" }
