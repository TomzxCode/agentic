[project]
name = "agentic"
version = "0.1.0"
description = "Track work as tasks and collaborate with LLM coding agents across Slack, GitHub, and Google Drive."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "uvicorn[standard]>=0.54.0",
    "sqlmodel>=0.0.50",
    "agent-client-protocol>=1.0.0",
    "httpx>=0.27",
    "structlog>=24.1",
    "pydantic-settings>=2.16.3",
    "sse-starlette>=3.7.0",
    "python-multipart>=0.0.34",
    "cyclopts>=5.5.2",
    "saq[sqlite]",
    "scalar-fastapi>=1.10.1",
    "croniter>=7.0.0",
    "tzlocal>=5.4.5",
    "pyyaml>=6.0.3",
]

[project.scripts]
agentic-server = "agentic.server_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic"]

[tool.uv.sources]
saq = { git = "https://github.com/tomzxforks/saq", rev = "dev" }
